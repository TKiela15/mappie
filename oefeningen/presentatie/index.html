# Inspiratie voor de digital garden van Tessa

---

5. introtekst van max. 180 tekens

---

# Onderwerp

Wat is jouw interesse, waarom, wat, hoe (cultuur, vakmanschap, sport, idool, ​hobby, passie categorie enz.) toon een hoeveelheid afbeeldingen.​
- De interesse die ik heb gekozen is Frida Kahlo, ik ben erg fan van haar werk. 
Ik hou van de kleuren, eerlijkheid en symboliek in haar schilderijen, ze weet abstracte gevoelens bijvoorbeeld in mooie, alledaagse objecten uit te drukken. 
In haar leven speelde ze met het idee van vaste gender rollen doormiddel van kleding en gedrag. 
Haar werk gaat ook vaak over feministische thema’s en de taboe’s die hierbinnen vallen. 
Ook haar doorzettingsvermogen vind ik inspirerend, ze kampte met gezondheidsproblemen vanaf een jonge leeftijd, zoals o.a. polio en depressie.
