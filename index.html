<!doctype html>

    <!-- Importeer het webring component, voeg jouw eigen domein toe in data-page -->
    <script
      data-page="https://t-kiela.nl/"
      src="https://digitaaltuintje.nl/webring.js"
      defer

  <body>
    <header>
      <nav>
        <ul>
          <li><a href="#">Digitaal Tuintje van tessa</a></li>
          <li>
            <a
              aria-label="Link_naar_de_hoofdpagina"
              href="http://127.0.0.1:5500/"
              >[Home]</a

          <li>
            <a

        </ul>

      <!-- 3 radio buttons, door dezelfe 'name' te gebruiken horen ze bij elkaar en kan er steeds maar één geselecteerd worden, :checked kijkt of een checkbox of radio button geselecteerd is. -->
      <form aria-label="knoppen_voor_instellen_van_light_of_dark_mode">
        <label>
          <input
            aria-label="knop_voor_auto_thema"
            type="radio"
            name="theme"
            value="auto-theme"
            checked
          />
          auto</label
        >

        <label>
          <input
            aria-label="knop_voor_licht_thema"
            type="radio"
            name="theme"
            value="light-theme"
          />
          licht
        </label>

        <label>
          <input
            aria-label="knop_voor_donker_thema"
            type="radio"
            name="theme"
            value="dark-theme"
          />
          donker
        </label>
      </form>

      <img
        src="./assets/images/fridaaa-kopie.svg"
        alt="Portretfoto van Frida"
      />

      <h1>Frida Kahlo</h1>

    <footer>
      <section><p>hi</p></section>

      <section>
        <p>
          Deze website gebruikt het lettertype 'Euripides', ontworpen door

      <section>
        <button
          aria-label="knop_naar_cookievenster"

          Cookies
        </button>
      </section>

      <img src="./assets/images/banner-patroontje.svg" alt="" />

    <dialog id="new-joke" class="modal">
      <form method="dialog">
        <label> <h3>Cookies</h3></label>
        <label
          ><img src="./assets/images/eyebrows.svg" alt="foto_ogen_frida"
        /></label>
        <label
          ><p>
            Deze website wordt gehost vanaf
            <a
              aria-label="link_naar_Github_webpagina"
              href="https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages"
            >
              Github Pages.</a
            >
            Klik je op accepteren? Dan ga je ermee akkoord dat Github bepaalde
            gegevens van jou kan verwerken, zoals bijvoorbeeld je IP-adres.
            (Github gebruikt deze gegevens voor o.a. beveiliging van de website)
          </p>

          <p>Deze website maakt zelf geen gebruik van cookies.</p></label
        >

        <button aria-label="sluit cookie venster" class="close">X</button>
        <label
          ><button aria-label="Accepteer cookies" type="accept">
            Accepteren
          </button></label
        >
        <label
          ><button aria-label="Weiger cookies" type="accept">
            Weigeren
          </button></label
        >
      </form>
    </dialog>
