<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Tessa" />
    <meta name="color-scheme" content="dark light" />

    <script defer src="script.js"></script>

    <title>Tuintje</title>
    <link rel="stylesheet" href="./assets/style/normal.css" />
    <script defer src="script.js"></script>

    <!-- Importeer het webring component, voeg jouw eigen domein toe in data-page -->
    <script
      data-page="https://t-kiela.nl/"
      src="https://digitaaltuintje.nl/webring.js"
      defer
    ></script>
  </head>

  <body>
    <header>
      <nav>
        <ul>
          <li><a href="">Digitaal Tuintje van tessa</a></li>
          <li>
            <a aria-label="naar de hoofdpagina" href="http://127.0.0.1:5500/"
              >Home</a
            >
          </li>

          <li>
            <a
              aria-label="Naar songtekst van cannonball"
              href="./OneDrive_1_6-10-2026/cannonball.html"
              >Cannonball!
            </a>
          </li>
          <li>
            <a
              aria-label="Link naar Github account"
              href="https://github.com/TKiela15"
              >Mijn Log</a
            >
          </li>

          <li>
            <a
              aria-label="Naar digitale tuintjes"
              href="https://digitaaltuintje.nl/"
              >Nog meer tuintjes</a
            >
          </li>
        </ul>
      </nav>

      <!-- 3 radio buttons, door dezelfe 'name' te gebruiken horen ze bij elkaar en kan er steeds maar één geselecteerd worden, :checked kijkt of een checkbox of radio button geselecteerd is. -->
      <form aria-label="knoppen_voor_instellen_van_light_of_dark_mode">
        <label>
          <input
            aria-label="automatisch thema"
            type="radio"
            name="theme"
            value="auto-theme"
            checked
          />auto
        </label>

        <label>
          <input
            aria-label="licht thema"
            type="radio"
            name="theme"
            value="light-theme"
          />
          licht
        </label>

        <label>
          <input
            aria-label="donker thema"
            type="radio"
            name="theme"
            value="dark-theme"
          />
          donker
        </label>
      </form>

      <img
        src="./assets/images/fridaaa-kopie.svg"
        alt="Portretfoto van Frida"
      />

      <h1>Frida Kahlo</h1>
    </header>

    <main>
      <h2 class="visually-hidden">
        "Afbeeldingen naar interessante onderwerpen over Frida"
      </h2>
      <img src="./assets/images/banner-patroontje.svg" alt="" />

      <section>
        <a aria-link="Naar 'Frida in het kort'" href="hoofd 1.html">
          <img
            src="./assets/images/frida-hoofd-II.png"
            alt="Eerste Frida hoofd"
          />
        </a>
      </section>

      <section>
        <a aria-link="Naar 'Webpagina twee'" href="hoofd 2.html">
          <img
            src="./assets/images/frida-hoofd-II.png"
            alt="Tweede Frida hoofd"
          />
        </a>
      </section>

      <section>
        <a aria-link="Naar 'Droomwereld & kunstwerken'" href="hoofd 3.html">
          <img
            src="./assets/images/frida-hoofd-II.png"
            alt="Derde Frida hoofd"
          />
        </a>
      </section>

      <section>
        <a aria-link="Naar 'La casa azul'" href="hoofd 4.html">
          <img
            src="./assets/images/frida-hoofd-II.png"
            alt="Vierde Frida hoofd"
          />
        </a>
      </section>

      <section>
        <a aria-link="Naar 'Webpagina vijf'" href="hoofd 5.html">
          <img
            src="./assets/images/frida-hoofd-II.png"
            alt="Vijfde Frida hoofd"
          />
        </a>
      </section>

      <section>
        <a aria-link="Naar 'Webpagina zes'" href="hoofd 6.html">
          <img
            src="./assets/images/frida-hoofd-II.png"
            alt="Zesde Frida hoofd"
          />
        </a>
      </section>

      <!-- brondv bschbvadhjkfv badfj -->
      <img src="./assets/images/banner-patroontje.svg" alt="" />
    </main>

    <!-- Footer -->

    <footer>
      <section></section>
      <section>
        <img src="./assets/images/rafelrand.svg" alt="" />
      </section>
      <section>
        <p>
          Deze website gebruikt het lettertype 'Euripides', ontworpen door
          <a
            aria-label="naar portfolio website van Tanvi"
            href="https://tanvi.network/"
            alt=""
            >Tanvi</a
          >
        </p>
      </section>
      <section>
        <p>[Copyleft 2026, all wrongs reversed]</p>
      </section>
      <section>
        <button
          aria-label="Naar cookievenster"
          commandfor="new-joke"
          command="show-modal"
        >
          Cookies
        </button>
      </section>

      <dialog id="new-joke" class="modal">
        <form method="dialog">
          <label></label>
          <label>
            <button aria-label="sluit cookie venster" class="close">
              X
            </button></label
          >
          <label><h3>Cookies</h3></label>
          <label
            ><img src="./assets/images/eyebrows.svg" alt="foto_ogen_frida"
          /></label>
          <label
            ><p>
              Deze website wordt gehost vanaf
              <a
                aria-label="Naar Github webpagina"
                href="https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages"
              >
                Github Pages.</a
              >
              Klik je op accepteren? Dan ga je ermee akkoord dat Github bepaalde
              gegevens van jou kan verwerken, zoals bijvoorbeeld je IP-adres.
              (Github gebruikt deze gegevens voor o.a. beveiliging van de
              website)
            </p>

            <p>Deze website maakt zelf geen gebruik van cookies.</p></label
          >

          <label><button type="submit">Accepteren</button></label>
          <label><button type="submit">Weigeren</button></label>
        </form>
      </dialog>
    </footer>
  </body>
</html>
